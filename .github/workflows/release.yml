name: Release

# A push to `release` builds وثيقة for macOS, Windows and Linux and publishes the downloads as a
# GitHub release, which installed copies offer as an update (update and restart).
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The interface catalogs (with Arabic) and the interface fonts (with Noto Sans Arabic), at the
  # commits PdfCraft pins.
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # Release n is version 1.<n>.0: the app's own version, the tag and the download names, which
      # the in-app updater (crates/craft-update) matches and checks.
      WATHIQA_VERSION: 1.${{ github.run_number }}.0
      PDFCRAFT_VERSION: 1.${{ github.run_number }}.0
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Interface translations and fonts
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/craft-i18n"
          git -C "$RUNNER_TEMP/craft-i18n" fetch -q --depth 1 https://github.com/storytold/craft-i18n "$(tr -d '[:space:]' < craft-i18n.rev)"
          git -C "$RUNNER_TEMP/craft-i18n" checkout -q FETCH_HEAD
          test -s "$RUNNER_TEMP/craft-i18n/locales/ar/pdfcraft.tsv"
          git init -q "$RUNNER_TEMP/craft-fonts"
          git -C "$RUNNER_TEMP/craft-fonts" fetch -q --depth 1 https://github.com/storytold/craft-fonts "$CRAFT_FONTS_REF"
          git -C "$RUNNER_TEMP/craft-fonts" checkout -q FETCH_HEAD
          {
            echo "CRAFT_I18N_DIR=$RUNNER_TEMP/craft-i18n"
            echo "CRAFT_I18N_REQUIRED=1"
            echo "CRAFT_FONTS_DIR=$RUNNER_TEMP/craft-fonts"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2  # reuse compiled dependencies between releases
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libssl-dev \
            libcups2-dev libdbus-1-dev
      - name: macOS signing certificate
        if: runner.os == 'macOS'
        # Signed and notarized when these repository secrets exist; otherwise ad-hoc (unsigned).
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          packaging/macos/import-cert.sh  # sets MACOS_SIGN_IDENTITY for the next step
      - name: macOS app (DMG), build
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DIST="$PWD/out" packaging/macos/package.sh --arch universal
          mv out/pdfcraft-*.dmg "out/wathiqa-$WATHIQA_VERSION-macos-universal.dmg"
      - name: Windows and Linux builds
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release --locked -p pdfcraft -p pdfcraft-cli
          mkdir -p out/Wathiqa
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md assets/fonts/OFL-*.txt out/Wathiqa/
          for f in "$CRAFT_FONTS_DIR"/fonts/*/OFL.txt; do cp "$f" "out/Wathiqa/OFL-$(basename "$(dirname "$f")").txt"; done
          # OCR models: the app finds them in models/ beside the executable.
          cargo xtask models "$PWD/out/Wathiqa/models"
          rm -f out/Wathiqa/models/*.part
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/release/pdfcraft.exe out/Wathiqa/Wathiqa.exe
            cp target/release/pdfcraft-cli.exe out/Wathiqa/wathiqa-cli.exe
            (cd out && 7z a "wathiqa-$WATHIQA_VERSION-windows-x64-portable.zip" Wathiqa >/dev/null)
          else
            cp target/release/pdfcraft out/Wathiqa/wathiqa
            cp target/release/pdfcraft-cli out/Wathiqa/wathiqa-cli
            tar -C out -czf "out/wathiqa-$WATHIQA_VERSION-linux-x86_64.tar.gz" Wathiqa
          fi
          rm -rf out/Wathiqa
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}.0
          name: وثيقة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            وثيقة: قارئ ومحرر عربي لملفات PDF، مبني على PdfCraft من فريق ArtCraft.

            - macOS (Apple Silicon and Intel, macOS 11 or later): the `.dmg`. Signed and notarized by Apple.
            - Windows: the `windows-x64-portable.zip`, unzip and run `Wathiqa.exe`.
            - Linux: the `linux-x86_64.tar.gz`, extract and run `wathiqa`.

            وثيقة تحدّث نفسها: عند توفر إصدار جديد تظهر رسالة «تحديث وإعادة تشغيل».
